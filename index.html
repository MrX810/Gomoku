<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gomoku Infinite</title>
  <!-- PeerJS für Online-Multiplayer ohne Backend -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #18181c;
      color: #fff;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }
    #ui {
      position: absolute;
      top: 15px;
      left: 15px;
      background: rgba(24, 24, 28, 0.9);
      padding: 18px;
      border-radius: 12px;
      z-index: 10;
      width: 300px;
      border: 1px solid #333;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }
    h1 { font-size: 1.2rem; margin-bottom: 12px; color: #4caf50; }
    button, input {
      margin: 4px 0;
      padding: 10px;
      width: 100%;
      border: none;
      border-radius: 6px;
      font-size: 0.9rem;
    }
    button {
      background: #4caf50;
      color: white;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s;
    }
    button:hover { background: #43a047; }
    input {
      background: #2a2a30;
      color: white;
      border: 1px solid #444;
      text-align: center;
    }
    .divider { margin: 12px 0; border-bottom: 1px solid #333; }
    #status { margin-top: 10px; font-size: 0.85rem; color: #ffeb3b; word-break: break-all; }
    .code-display {
      background: #2a2a30;
      padding: 8px;
      border-radius: 6px;
      text-align: center;
      font-family: monospace;
      font-size: 1.1rem;
      color: #64b5f6;
      user-select: all;
      margin: 6px 0;
    }
    canvas { display: block; cursor: grab; }
    canvas:active { cursor: grabbing; }
  </style>
</head>
<body>

  <div id="ui">
    <h1>Gomoku (Endlos)</h1>
    
    <button onclick="startBotMode()">🤖 Gegen Bot spielen</button>

    <div class="divider"></div>

    <p style="font-size: 0.85rem; color: #aaa;">Online Modus (Freund-Code):</p>
    <div class="code-display" id="my-code">Verbinde...</div>
    
    <input type="text" id="join-code" placeholder="Code vom Freund eingeben">
    <button onclick="connectToPeer()" style="background: #2196f3;">Verbinden & Spielen</button>

    <div id="status">Wähle einen Modus.</div>
    <button onclick="resetGame()" style="background: #e53935; margin-top: 10px;">Neustart</button>
  </div>

  <canvas id="board"></canvas>

  <script>
    const canvas = document.getElementById('board');
    const ctx = canvas.getContext('2d');

    const CELL_SIZE = 40;
    let cameraX = 0;
    let cameraY = 0;
    let isDragging = false;
    let dragStartX = 0;
    let dragStartY = 0;
    let hasMovedMouse = false;

    // Spiel-Zustand
    let board = {}; // Key: "x,y", Value: "BLACK" | "WHITE"
    let currentTurn = "BLACK"; // BLACK startet immer
    let myColor = "BLACK";
    let gameMode = null; // 'BOT', 'ONLINE_HOST', 'ONLINE_GUEST'
    let gameOver = false;

    // PeerJS Online-Verbindung
    let peer = null;
    let conn = null;

    function initCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      cameraX = canvas.width / 2;
      cameraY = canvas.height / 2;
      draw();
    }
    window.addEventListener('resize', initCanvas);

    // --- PeerJS Setup ---
    function initPeer() {
      const randomId = Math.floor(100000 + Math.random() * 900000).toString();
      peer = new Peer(randomId);

      peer.on('open', (id) => {
        document.getElementById('my-code').innerText = id;
      });

      peer.on('connection', (c) => {
        conn = c;
        gameMode = 'ONLINE_HOST';
        myColor = 'BLACK';
        setStatus("Spieler beigetreten! Du bist Schwarz (Beginnst).");
        setupConn();
        resetGame(false);
      });
    }

    function connectToPeer() {
      const code = document.getElementById('join-code').value.trim();
      if (!code) return alert("Bitte einen Code eingeben!");
      
      conn = peer.connect(code);
      gameMode = 'ONLINE_GUEST';
      myColor = 'WHITE';
      setStatus("Verbinde mit Host...");
      setupConn();
      resetGame(false);
    }

    function setupConn() {
      conn.on('open', () => {
        if (gameMode === 'ONLINE_GUEST') {
          setStatus("Verbunden! Du bist Weiß.");
        }
      });

      conn.on('data', (data) => {
        if (data.type === 'MOVE') {
          makeMove(data.x, data.y, data.color, false);
        } else if (data.type === 'RESET') {
          resetGame(false);
        }
      });

      conn.on('close', () => {
        setStatus("Verbindung getrennt.");
      });
    }

    // --- Spielfeld Render Logic ---
    function draw() {
      ctx.fillStyle = '#18181c';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.strokeStyle = '#2a2a35';
      ctx.lineWidth = 1;

      const startX = Math.floor((-cameraX) / CELL_SIZE) - 1;
      const endX = Math.ceil((canvas.width - cameraX) / CELL_SIZE) + 1;
      const startY = Math.floor((-cameraY) / CELL_SIZE) - 1;
      const endY = Math.ceil((canvas.height - cameraY) / CELL_SIZE) + 1;

      ctx.beginPath();
      for (let x = startX; x <= endX; x++) {
        const px = x * CELL_SIZE + cameraX;
        ctx.moveTo(px, 0);
        ctx.lineTo(px, canvas.height);
      }
      for (let y = startY; y <= endY; y++) {
        const py = y * CELL_SIZE + cameraY;
        ctx.moveTo(0, py);
        ctx.lineTo(canvas.width, py);
      }
      ctx.stroke();

      // Ursprung markieren (0,0)
      ctx.strokeStyle = '#444';
      ctx.beginPath();
      ctx.arc(cameraX, cameraY, 4, 0, Math.PI * 2);
      ctx.stroke();

      // Steine zeichnen
      for (let key in board) {
        const [gx, gy] = key.split(',').map(Number);
        const px = gx * CELL_SIZE + cameraX;
        const py = gy * CELL_SIZE + cameraY;

        ctx.beginPath();
        ctx.arc(px, py, CELL_SIZE * 0.4, 0, Math.PI * 2);
        if (board[key] === 'BLACK') {
          ctx.fillStyle = '#111';
          ctx.strokeStyle = '#666';
        } else {
          ctx.fillStyle = '#fff';
          ctx.strokeStyle = '#bbb';
        }
        ctx.lineWidth = 2;
        ctx.fill();
        ctx.stroke();
      }
    }

    // --- Interaktionen & Dragging ---
    canvas.addEventListener('mousedown', (e) => {
      isDragging = true;
      hasMovedMouse = false;
      dragStartX = e.clientX - cameraX;
      dragStartY = e.clientY - cameraY;
    });

    canvas.addEventListener('mousemove', (e) => {
      if (isDragging) {
        cameraX = e.clientX - dragStartX;
        cameraY = e.clientY - dragStartY;
        hasMovedMouse = true;
        draw();
      }
    });

    canvas.addEventListener('mouseup', (e) => {
      isDragging = false;
      if (!hasMovedMouse) {
        handleClick(e.clientX, e.clientY);
      }
    });

    function handleClick(screenX, screenY) {
      if (gameOver) return;
      if (gameMode === 'ONLINE_HOST' && currentTurn !== 'BLACK') return;
      if (gameMode === 'ONLINE_GUEST' && currentTurn !== 'WHITE') return;
      if (gameMode === 'BOT' && currentTurn !== 'BLACK') return;

      const gx = Math.round((screenX - cameraX) / CELL_SIZE);
      const gy = Math.round((screenY - cameraY) / CELL_SIZE);

      if (!board[`${gx},${gy}`]) {
        makeMove(gx, gy, currentTurn, true);

        if (gameMode === 'BOT' && !gameOver && currentTurn === 'WHITE') {
          setTimeout(botMove, 300);
        }
      }
    }

    function makeMove(x, y, color, isLocal) {
      const key = `${x},${y}`;
      board[key] = color;
      draw();

      if (isLocal && conn && conn.open) {
        conn.send({ type: 'MOVE', x: x, y: y, color: color });
      }

      if (checkWin(x, y, color)) {
        gameOver = true;
        setStatus(`🏆 ${color === 'BLACK' ? 'Schwarz' : 'Weiß'} hat gewonnen!`);
        return;
      }

      currentTurn = color === 'BLACK' ? 'WHITE' : 'BLACK';
      updateTurnStatus();
    }

    // --- Gewinn-Prüfung (5 in einer Reihe) ---
    function checkWin(x, y, color) {
      const directions = [
        [[1, 0], [-1, 0]],   // Horizontal
        [[0, 1], [0, -1]],   // Vertikal
        [[1, 1], [-1, -1]],  // Diagonal \
        [[1, -1], [-1, 1]]   // Diagonal /
      ];

      for (let dir of directions) {
        let count = 1;
        for (let [dx, dy] of dir) {
          let cx = x + dx;
          let cy = y + dy;
          while (board[`${cx},${cy}`] === color) {
            count++;
            cx += dx;
            cy += dy;
          }
        }
        if (count >= 5) return true;
      }
      return false;
    }

    // --- Bot Logik ---
    function startBotMode() {
      gameMode = 'BOT';
      myColor = 'BLACK';
      setStatus("Gegen Bot gestartet. Du bist Schwarz.");
      resetGame(false);
    }

    function botMove() {
      let bestScore = -1;
      let bestMove = null;

      // Berechne mögliche Züge in der Nähe bestehender Steine
      const candidates = new Set();
      for (let key in board) {
        const [x, y] = key.split(',').map(Number);
        for (let dx = -1; dx <= 1; dx++) {
          for (let dy = -1; dy <= 1; dy++) {
            if (dx === 0 && dy === 0) continue;
            const nk = `${x + dx},${y + dy}`;
            if (!board[nk]) candidates.add(nk);
          }
        }
      }

      if (candidates.size === 0) candidates.add("0,0");

      for (let cand of candidates) {
        const [x, y] = cand.split(',').map(Number);
        
        // Bewerte Offensiv- und Defensivpotenzial
        let score = evaluatePoint(x, y, 'WHITE') * 1.1 + evaluatePoint(x, y, 'BLACK');
        if (score > bestScore) {
          bestScore = score;
          bestMove = { x, y };
        }
      }

      if (bestMove) {
        makeMove(bestMove.x, bestMove.y, 'WHITE', false);
      }
    }

    function evaluatePoint(x, y, color) {
      let score = 0;
      const dirs = [[1, 0], [0, 1], [1, 1], [1, -1]];
      for (let [dx, dy] of dirs) {
        let count = 1;
        for (let step of [1, -1]) {
          let cx = x + dx * step;
          let cy = y + dy * step;
          while (board[`${cx},${cy}`] === color) {
            count++;
            cx += dx * step;
            cy += dy * step;
          }
        }
        score += Math.pow(10, count);
      }
      return score;
    }

    // --- Hilfsfunktionen ---
    function setStatus(msg) {
      document.getElementById('status').innerText = msg;
    }

    function updateTurnStatus() {
      if (gameOver) return;
      let turnText = currentTurn === 'BLACK' ? 'Schwarz' : 'Weiß';
      if (gameMode.startsWith('ONLINE')) {
        let isMyTurn = currentTurn === myColor;
        setStatus(`Am Zug: ${turnText} ${isMyTurn ? '(Du)' : '(Gegner)'}`);
      } else {
        setStatus(`Am Zug: ${turnText}`);
      }
    }

    function resetGame(sendPeer = true) {
      board = {};
      currentTurn = 'BLACK';
      gameOver = false;
      draw();
      updateTurnStatus();
      if (sendPeer && conn && conn.open) {
        conn.send({ type: 'RESET' });
      }
    }

    // Start
    initCanvas();
    initPeer();
  </script>
</body>
</html>
